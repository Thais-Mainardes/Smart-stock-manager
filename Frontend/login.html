<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Smart Stock Manager</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body class="login-page">

    <main class="login-container">

        <section class="login-card">

            <h1>Smart Stock Manager</h1>

            <p class="login-subtitle">
                Acesse sua conta
            </p>

            <form id="login-form">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="seu@email.com"
                    required
                >

                <label for="password">
                    Senha
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Digite sua senha"
                    required
                >

                <button type="submit">
                    Entrar
                </button>

            </form>

            <p id="login-message"></p>

        </section>

    </main>

    <script src="js/login.js"></script>

</body>

</html>
