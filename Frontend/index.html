<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Stock Manager</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">
        <div>
            <h1>Smart Stock Manager</h1>
            <p>Gerenciamento inteligente de estoque</p>
        </div>
    </header>

    <main class="container">

        <section class="dashboard">
            <h2>Dashboard</h2>

            <div class="cards">

                <div class="card">
                    <h3>Total de produtos</h3>
                    <p id="total-products">0</p>
                </div>

                <div class="card">
                    <h3>Estoque baixo</h3>
                    <p id="low-stock">0</p>
                </div>

                <div class="card">
                    <h3>Movimentações</h3>
                    <p id="total-movements">0</p>
                </div>

            </div>
        </section>

        <section class="products">
            <div class="section-header">
                <h2>Produtos</h2>

                <button id="add-product">
                    + Adicionar produto
                </button>
            </div>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Produto</th>
                            <th>Categoria</th>
                            <th>Estoque</th>
                            <th>Estoque mínimo</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="product-list">
                        <!-- Os produtos serão inseridos pelo JavaScript -->
                    </tbody>

                </table>

            </div>
        </section>

    </main>

    <script src="js/app.js"></script>

</body>
</html>
