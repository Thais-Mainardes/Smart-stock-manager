<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Movimentações - Smart Stock Manager</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <header class="header">

    <div>
        <h1>Smart Stock Manager</h1>
        <p>Gerenciamento Inteligente de Estoque</p>
    </div>

    <nav class="navigation">

        <a href="index.html">
            Dashboard
        </a>

        <a href="movements.html">
            Movimentações
        </a>

    </nav>

</header>


    <main class="container">

        <section class="products">

            <div class="section-header">

                <h2>Movimentações de estoque</h2>

                <button id="new-movement">
                    + Nova movimentação
                </button>
                <div id="movement-modal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>Nova movimentação</h2>

            <button id="close-movement-modal" class="close-button">
                ×
            </button>

        </div>

        <form id="movement-form">

            <label for="movement-product">
                Produto
            </label>

            <select id="movement-product" required>
                <option value="">Selecione um produto</option>
            </select>

            <label for="movement-type">
                Tipo
            </label>

            <select id="movement-type" required>
                <option value="">Selecione o tipo</option>
                <option value="ENTRY">Entrada</option>
                <option value="EXIT">Saída</option>
            </select>

            <label for="movement-quantity">
                Quantidade
            </label>

            <input
                type="number"
                id="movement-quantity"
                min="1"
                required
            >

            <label for="movement-description">
                Descrição
            </label>

            <input
                type="text"
                id="movement-description"
                placeholder="Ex: compra de materiais"
                required
            >

            <button type="submit">
                Registrar movimentação
            </button>

        </form>

    </div>

</div>

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>Data</th>

                            <th>Produto</th>

                            <th>Tipo</th>

                            <th>Quantidade</th>

                            <th>Descrição</th>

                        </tr>

                    </thead>


                    <tbody id="movement-list">

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <script src="data/products.js"></script>
    <script src="js/movements.js"></script>

</body>

</html>
